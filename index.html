<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>TATA FLOW 靈魂學 · 七七地赦 鑑定預約</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF6F0; --card:#FFFFFF; --ink:#3A2C3A; --soft:#8A7683; --line:#EBE0DA;
  --gold:#C9A24E; --aura1:#EAD9E6; --aura2:#DCE7EE; --aura3:#F3E4DC;
  --tata:#8E6E9E; --tataS:#ECE4F1;
  --liu:#3F8E86;  --liuS:#DAECE9;
  --duo:#C67F72;  --duoS:#F5E6E2;
  --ok:#5C9B7A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  line-height:1.6; -webkit-text-size-adjust:100%;
}
.wrap{max-width:520px;margin:0 auto;padding:0 20px 120px}
.serif{font-family:"Noto Serif TC",serif}

/* 預覽橫幅 */
.demo{background:#3A2C3A;color:#F3E4DC;font-size:12.5px;text-align:center;padding:7px 14px;letter-spacing:.3px}

/* Hero */
.hero{position:relative;text-align:center;padding:46px 20px 30px;overflow:hidden}
.hero::before{content:"";position:absolute;inset:-40% -20% auto;height:340px;z-index:0;
  background:radial-gradient(60% 80% at 30% 20%,var(--aura1),transparent 70%),
             radial-gradient(55% 75% at 80% 30%,var(--aura2),transparent 70%),
             radial-gradient(50% 70% at 55% 90%,var(--aura3),transparent 70%);
  filter:blur(6px);opacity:.9}
.hero>*{position:relative;z-index:1}
.orbit{width:46px;height:46px;margin:0 auto 14px;position:relative}
.orbit .ring{position:absolute;inset:0;border:1.5px solid var(--gold);border-radius:50%;opacity:.55;transform:rotate(-18deg) scaleY(.45)}
.orbit .core{position:absolute;top:50%;left:50%;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--gold));box-shadow:0 0 10px rgba(201,162,78,.6)}
.orbit .moon{position:absolute;top:50%;left:0;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:var(--tata)}
.kicker{font-size:12px;letter-spacing:4px;color:var(--gold);font-weight:700;margin-bottom:6px}
.hero h1{font-size:27px;font-weight:600;margin:0 0 8px;letter-spacing:1px}
.hero p{margin:0;color:var(--soft);font-size:14px}

/* 卡片與步驟 */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin:14px 0;
  box-shadow:0 1px 0 rgba(58,44,58,.02)}
.step{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.num{flex:0 0 24px;width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;
  font-size:13px;display:flex;align-items:center;justify-content:center;font-weight:600}
.step h3{margin:0;font-size:16px;font-weight:600}
.step .req{color:var(--duo);font-size:12px;margin-left:2px}
.hint{font-size:12.5px;color:var(--soft);margin:-4px 0 12px 34px}

input[type=text],input[type=number]{
  width:100%;font:inherit;font-size:16px;padding:13px 14px;border:1.5px solid var(--line);
  border-radius:12px;background:#FCFAF7;color:var(--ink);outline:none;transition:border-color .15s}
input:focus{border-color:var(--tata)}

/* 推薦人 */
.refs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ref{border:1.5px solid var(--line);border-radius:14px;padding:14px 6px;text-align:center;
  cursor:pointer;background:#FCFAF7;transition:.15s;user-select:none}
.ref .dot{width:14px;height:14px;border-radius:50%;margin:0 auto 8px}
.ref .nm{font-weight:600;font-size:15px}
.ref[data-on="1"]{background:#fff;box-shadow:0 4px 14px rgba(58,44,58,.08)}

/* 照片 */
.photo{display:flex;align-items:center;gap:14px}
.pbtn{flex:0 0 96px;width:96px;height:96px;border-radius:16px;border:1.5px dashed var(--line);
  background:#FCFAF7;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;cursor:pointer;color:var(--soft);font-size:12px;overflow:hidden;position:relative}
.pbtn svg{width:26px;height:26px;stroke:var(--soft);fill:none;stroke-width:1.6}
.pbtn img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ptext{font-size:12.5px;color:var(--soft)}

/* 時段 */
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.seg.seg3{grid-template-columns:repeat(3,1fr)}
.segbtn{border:1.5px solid var(--line);border-radius:12px;padding:13px 4px;text-align:center;
  font-weight:600;font-size:15.5px;cursor:pointer;background:#FCFAF7;transition:.12s;user-select:none}
.segbtn.on{background:var(--tata);color:#fff;border-color:var(--tata)}
.segbtn.off{opacity:.32;cursor:default}
.poolnote{font-size:12.5px;color:var(--tata);background:var(--tataS);border-radius:10px;padding:7px 10px;margin-bottom:12px;text-align:center}
.avdots{display:flex;gap:4px;justify-content:center;margin-top:4px}
.avdots i{width:7px;height:7px;border-radius:50%;display:inline-block}
.dategroup{margin-bottom:16px}
.datehd{display:flex;align-items:baseline;gap:8px;margin:0 0 10px}
.datehd .d{font-family:"Noto Serif TC",serif;font-size:18px;font-weight:600}
.datehd .w{font-size:12.5px;color:var(--soft)}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{border:1.5px solid var(--line);border-radius:11px;padding:10px 4px;text-align:center;
  font-size:14.5px;cursor:pointer;background:#FCFAF7;transition:.12s;font-variant-numeric:tabular-nums}
.slot[data-on="1"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.empty{color:var(--soft);font-size:13.5px;text-align:center;padding:14px 0}

/* 送出 */
.submit{position:sticky;bottom:0;padding:16px 0 22px;background:linear-gradient(transparent,var(--bg) 22%)}
.btn{width:100%;font:inherit;font-size:17px;font-weight:600;color:#fff;background:var(--ink);
  border:none;border-radius:14px;padding:16px;cursor:pointer;transition:.15s;letter-spacing:1px}
.btn:disabled{opacity:.4;cursor:default}
.btn.gold{background:var(--gold)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}

/* 成功 */
.done{text-align:center;padding:40px 10px}
.done .mark{width:70px;height:70px;border-radius:50%;background:var(--tataS);margin:0 auto 20px;
  display:flex;align-items:center;justify-content:center}
.done .mark svg{width:34px;height:34px;stroke:var(--tata);fill:none;stroke-width:2.2}
.done h2{font-family:"Noto Serif TC",serif;font-weight:600;margin:0 0 6px}
.recap{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:22px 0;text-align:left}
.recap .row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14.5px}
.recap .row:last-child{border:none}
.recap .row span:first-child{color:var(--soft)}
.code{font-family:"Noto Serif TC",serif;letter-spacing:2px;font-weight:700}

/* 後台 */
.legend{display:flex;gap:16px;justify-content:center;margin:2px 0 6px;font-size:13px;color:var(--soft)}
.legend b{display:inline-flex;align-items:center;gap:6px;font-weight:500}
.legend .dot{width:11px;height:11px;border-radius:50%}
.arow{display:flex;gap:8px;margin:14px 0}
.aslot{border-radius:11px;padding:9px 6px;text-align:center;font-size:13.5px;border:1.5px solid var(--line)}
.aslots{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.aslot.open{color:var(--soft);background:#FCFAF7;cursor:pointer}
.aslot.bk{cursor:pointer;color:#fff;font-weight:500;border:none;position:relative}
.aslot.pend{box-shadow:inset 0 0 0 2px rgba(255,255,255,.75)}
.aslot .badge{display:inline-block;margin-top:3px;font-size:10px;background:rgba(255,255,255,.32);color:#fff;border-radius:8px;padding:1px 7px}
.cur{text-align:center;color:var(--soft);font-size:14px;line-height:1.9}
.cur b{color:var(--ink);font-size:18px;font-family:"Noto Serif TC",serif}
.aslot .t{font-variant-numeric:tabular-nums;opacity:.85;font-size:12px}
.aslot .n{font-weight:600;font-size:14.5px;margin-top:1px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.panel label{font-size:13px;color:var(--soft);display:block;margin:10px 0 5px}
input[type=date],input[type=time]{width:100%;font:inherit;font-size:16px;padding:12px;border:1.5px solid var(--line);border-radius:11px;background:#FCFAF7;color:var(--ink)}
.reqlink{display:inline-block;margin-top:16px;color:var(--tata);font-size:14px;font-weight:600;cursor:pointer;text-decoration:underline}
.reqday{margin-bottom:16px}
.reqday-t{font-size:13px;color:var(--soft);margin-bottom:6px}
.reqtime{display:flex;align-items:center;gap:8px;margin-top:8px}
.reqtime input{flex:1}
.reqtime span{color:var(--soft)}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.chip{border:1.5px solid var(--line);border-radius:20px;padding:6px 12px;font-size:13px;cursor:pointer;background:#FCFAF7}
.chip[data-on="1"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.quick{font-size:12.5px;color:var(--tata);cursor:pointer;text-decoration:underline;margin-right:12px}

/* modal */
.mask{position:fixed;inset:0;background:rgba(40,28,40,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal{background:var(--card);border-radius:22px 22px 0 0;width:100%;max-width:520px;padding:22px 22px 30px;animation:up .22s ease}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.modal .ph{width:100%;height:230px;object-fit:cover;border-radius:14px;background:#F0E8E4;margin-bottom:16px}
.mrow{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line);font-size:15px}
.mrow span:first-child{color:var(--soft)}
.tag{display:inline-block;padding:2px 10px;border-radius:20px;font-size:13px;color:#fff}
.center{text-align:center}
.spin{width:22px;height:22px;border:2.5px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:sp .7s linear infinite;margin:40px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.link{color:var(--soft);font-size:12px;text-align:center;padding:24px 0 10px}
.link a{color:var(--soft)}
.hbk{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;background:#fff}
</style>
</head>
<body>
<div id="banner"></div>
<div id="app"><div class="spin"></div></div>

<script>
/* ═══════════ 設定 ═══════════ */
const API = "https://script.google.com/macros/s/AKfycbwVLQ4Wpyg6blC377EosKoWHU9bVVh6kTiJdCCha28_Tgb6cbytYeu0m9UFeT4Xxmu9qA/exec";   // ← 你的 Apps Script 網址
/* 分組：每組一位主鑑定師 + 助理（要與 Code.gs 的 GROUPS 一致）*/
const GROUPS = [
  { reader:"塔塔",  helpers:["六六","朵朵"] },
  { reader:"Joyer", helpers:["Alice"] }
];
const REFERRERS = [];
GROUPS.forEach(g=>{ REFERRERS.push(g.reader); g.helpers.forEach(h=>REFERRERS.push(h)); });
function readerOf(n){ for(const g of GROUPS){ if(g.reader===n||g.helpers.includes(n)) return g.reader; } return null; }
function groupOf(n){ for(const g of GROUPS){ if(g.reader===n||g.helpers.includes(n)) return g; } return null; }
function isReader(n){ return GROUPS.some(g=>g.reader===n); }
const PALETTE = ["#8E6E9E","#3F8E86","#C67F72","#C9A24E","#5C87B5","#B5705C"];
const RCOLOR = {};
REFERRERS.forEach((r,i)=>{ RCOLOR[r]={hex:PALETTE[i%PALETTE.length]}; });
const DEMO = API.indexOf("PASTE_") === 0;

/* ═══════════ 後端呼叫（POST text/plain 避開 CORS）═══════════ */
async function call(payload){
  if(DEMO) return demo(payload);
  const r = await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify(payload)});
  return r.json();
}
/* 預覽模式假資料（雙鑑定師） */
const _demoTata = [ // 塔塔的時段
  {date:"2026-07-25",slots:["14:00","14:30","15:00","20:00","20:30"]},
  {date:"2026-07-26",slots:["10:30","11:00","14:00","15:00"]},
];
const _demoJoyer = [ // Joyer 的時段
  {date:"2026-07-25",slots:["14:00","16:00","19:00"]},
  {date:"2026-08-05",slots:["14:00","14:30","20:00"]},
];
const _demoBook = {
  "塔塔|2026-07-25 14:00":{name:"王小美",age:"38",referrer:"塔塔"},
  "塔塔|2026-07-25 20:00":{name:"陳雅婷",age:"45",referrer:"六六"},
  "Joyer|2026-07-25 16:00":{name:"李大明",age:"50",referrer:"Alice"}
};
function _flagsFor(reader,t){ // 誰可搭配（demo：早上助理可、其他都可）
  const g=GROUPS.find(x=>x.reader===reader), co={}; const h=parseInt(t,10);
  (g?g.helpers:[]).forEach((hp,i)=> co[hp]= h<12 ? (i===0) : true );
  return co;
}
function _readerDates(reader){ return reader==="Joyer"?_demoJoyer:_demoTata; }
function _allDates(){ // 兩位鑑定師合併給前台
  const out={};
  GROUPS.forEach(g=>_readerDates(g.reader).forEach(d=>{
    d.slots.forEach(t=>{ if(_demoBook[g.reader+"|"+d.date+" "+t])return;
      (out[d.date]=out[d.date]||[]).push({time:t,reader:g.reader,co:_flagsFor(g.reader,t)}); });
  }));
  return Object.keys(out).sort().map(d=>({date:d,slots:out[d].sort((a,b)=>a.time<b.time?-1:1)}));
}
const _demoAcc={"9planets":{name:"塔塔",role:"reader"},"joyer123":{name:"Joyer",role:"reader"},
  "liu666":{name:"六六",role:"helper"},"duo888":{name:"朵朵",role:"helper"},"alice123":{name:"Alice",role:"helper"}};
function demo(p){
  if(p.action==="slots") return {ok:true,dates:_allDates()};
  if(p.action==="login"){const a=_demoAcc[p.pw]; if(!a)return{ok:false,msg:"登入碼錯誤"};
    const g=GROUPS.find(x=>x.reader===a.name||x.helpers.includes(a.name));
    return {ok:true,name:a.name,role:a.role,reader:g.reader,helpers:g.helpers};}
  if(p.action==="admin"){const a=_demoAcc[p.pw]; if(!a)return{ok:false,msg:"登入碼錯誤"};
    const g=GROUPS.find(x=>x.reader===a.name||x.helpers.includes(a.name));
    if(a.role==="reader"){
      return {ok:true,role:"reader",name:a.name,helpers:g.helpers,dates:_readerDates(a.name).map(d=>({date:d.date,
        slots:d.slots.map(t=>{const b=_demoBook[a.name+"|"+d.date+" "+t];const co=_flagsFor(a.name,t);
          return b?{time:t,booked:true,co,booking:{code:"9P-DEMO",...b,age:"40",photoId:"",submitted:"",status:"待確認"}}:{time:t,booked:false,co};})}))};
    }
    return {ok:true,role:"helper",name:a.name,reader:g.reader,
      dates:_readerDates(g.reader).map(d=>({date:d.date,slots:d.slots.map(t=>({time:t,booked:!!_demoBook[g.reader+"|"+d.date+" "+t],mine:_flagsFor(g.reader,t)[a.name]}))})),
      bookings:Object.keys(_demoBook).filter(k=>_demoBook[k].referrer===a.name).map(k=>{const [rr,dt]=k.split("|");const [dd,tt]=dt.split(" ");
        return {...(_demoBook[k]),code:"9P-DEMO",age:"40",photoId:"",status:"待確認",date:dd,time:tt};})};
  }
  if(p.action==="book"){ if(_demoBook[readerOf(p.referrer)+"|"+p.date+" "+p.time]) return {ok:false,taken:true,msg:"這個時段剛剛被預約了，請重新選擇"};
    return {ok:true,code:"9P"+Date.now().toString().slice(-6),date:p.date,time:p.time};}
  if(p.action==="request") return {ok:true};
  if(p.action==="confirm") return {ok:true};
  if(p.action==="getBooking") return {ok:true,booking:{code:"9P-DEMO",name:"王小美",date:"2026-07-25",time:"20:00",referrer:"六六",status:"已確認"}};
  if(p.action==="reschedule") return {ok:true,date:p.date,time:p.time};
  if(p.action==="addSlots") return {ok:true,added:p.times.length};
  if(p.action==="setAvail") return {ok:true};
  if(p.action==="setMyAvail") return {ok:true};
  if(p.action==="delSlot")  return {ok:true};
  if(p.action==="cancel")   return {ok:true};
  return {ok:false,msg:"demo"};
}

/* ═══════════ 小工具 ═══════════ */
const WD = ["日","一","二","三","四","五","六"];
function dLabel(iso){const [y,m,d]=iso.split("-").map(Number);
  const wd=WD[new Date(y,m-1,d).getDay()];return {md:m+"/"+d,wd:"（"+wd+"）"};}
const $=s=>document.querySelector(s);
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function banner(){$("#banner").innerHTML = DEMO
  ? '<div class="demo">預覽模式 · 尚未連接後端（貼上 Apps Script 網址即正式運作）</div>' : '';}

/* ═══════════ 路由 ═══════════ */
function route(){banner();
  const h=location.hash.replace("#","");
  if(h==="/admin") return admin();
  if(h.indexOf("/edit")===0) return editPage();
  customer();}
window.addEventListener("hashchange",route);
window.addEventListener("DOMContentLoaded",route);

/* ═══════════ 前台：預約 ═══════════ */
const form = {name:"",email:"",age:"",photo:"",referrer:"",dayType:"",period:"",date:"",time:"",mode:"book"};
async function customer(){
  form.referrer="";form.dayType="";form.period="";form.date="";form.time="";form.mode="book";
  $("#app").innerHTML='<div class="spin"></div>';
  let res; try{res=await call({action:"slots"});}catch(e){res={ok:false};}
  const dates = (res&&res.ok)?res.dates:[];
  AVAIL=[]; dates.forEach(g=>g.slots.forEach(s=>AVAIL.push({date:g.date,time:s.time,reader:s.reader,co:s.co||{}})));

  $("#app").innerHTML = `
  <div class="hero">
    <div class="orbit"><div class="ring"></div><div class="moon"></div><div class="core"></div></div>
    <div class="kicker">TATA FLOW 靈魂學</div>
    <h1 class="serif">七七地赦　鑑定預約</h1>
    <p>留下你的資料與想預約的時段，送出後我們會與你確認。</p>
  </div>
  <div class="wrap">
    <div class="card">
      <div class="step"><div class="num">1</div><h3>姓名<span class="req">＊</span></h3></div>
      <div class="hint" style="margin-left:0">請填寫本名，勿用暱稱。</div>
      <input id="f_name" type="text" placeholder="請填寫本名" autocomplete="name">
    </div>
    <div class="card">
      <div class="step"><div class="num">2</div><h3>Email<span class="req">＊</span></h3></div>
      <div class="hint" style="margin-left:0">預約成功通知與日後改期連結都會寄到這裡，請務必填正確。</div>
      <input id="f_email" type="email" inputmode="email" placeholder="you@example.com" autocomplete="email">
    </div>
    <div class="card">
      <div class="step"><div class="num">3</div><h3>虛歲<span class="req">＊</span></h3></div>
      <div class="hint" style="margin-left:0">算法：116 − 出生年（民國）。例如民國 70 年出生 → 46。</div>
      <input id="f_age" type="number" inputmode="numeric" placeholder="例如 46">
    </div>
    <div class="card">
      <div class="step"><div class="num">4</div><h3>自拍照<span class="req">＊</span></h3></div>
      <div class="hint" style="margin-left:0">請拍正臉、光線自然，避免過度美肌濾鏡，供老師鑑定參考。</div>
      <div class="photo">
        <label class="pbtn" id="pbtn">
          <svg viewBox="0 0 24 24"><path d="M3 8a2 2 0 0 1 2-2h2l1.5-2h7L19 6h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="13" cy="12" r="3.4"/></svg>
          <span>點一下拍照</span>
          <input id="f_photo" type="file" accept="image/*" capture="user" hidden>
        </label>
        <div class="ptext" id="ptext">尚未上傳</div>
      </div>
    </div>
    <div class="card">
      <div class="step"><div class="num">5</div><h3>推薦人<span class="req">＊</span></h3></div>
      <div class="refs" id="refs">${REFERRERS.map(r=>`
        <div class="ref" data-r="${r}" data-on="0">
          <div class="dot" style="background:${RCOLOR[r].hex}"></div><div class="nm">${r}</div>
        </div>`).join("")}</div>

        <div class="reqlink" id="toReq">以上時段都無法配合？　另行申請其他時段 →</div>
      </div>
      <div id="reqArea" style="display:none">
        <div class="hint" style="margin-left:0">填寫你方便的時間（至少一個，最多三個），我們會另行為你安排。</div>
        ${[0,1,2].map(i=>`
        <div class="reqday">
          <div class="reqday-t">第 ${i+1} 天${i>0?'（選填）':''}</div>
          <input type="date" id="req${i}_d">
          <div class="reqtime"><input type="time" id="req${i}_s"><span>—</span><input type="time" id="req${i}_e"></div>
        </div>`).join("")}
        <div class="reqlink" id="toSlot">← 回到選擇現有時段</div>
      </div>
    </div>
    <div class="submit"><button class="btn" id="go" disabled>送出預約</button></div>
  </div>`;

  // 綁定
  $("#f_name").oninput=e=>{form.name=e.target.value.trim();check();};
  $("#f_email").oninput=e=>{form.email=e.target.value.trim();check();};
  $("#f_age").oninput =e=>{form.age=e.target.value.trim();check();};
  $("#f_photo").onchange=onPhoto;
  document.querySelectorAll("#refs .ref").forEach(el=>el.onclick=()=>{
    document.querySelectorAll("#refs .ref").forEach(x=>{x.dataset.on="0";x.style.borderColor="";});
    el.dataset.on="1";el.style.borderColor=RCOLOR[el.dataset.r].hex;form.referrer=el.dataset.r;
    form.dayType="";form.period="";form.date="";form.time="";
    renderSlots();check();});
  renderSlots();
  // 模式切換：現有時段 ↔ 另行申請
  $("#toReq").onclick=()=>setMode("request");
  $("#toSlot").onclick=()=>setMode("book");
  [0,1,2].forEach(i=>["_d","_s","_e"].forEach(k=>{
    const el=$("#req"+i+k); if(el) el.onchange=check;
  }));
  $("#go").onclick=submit;
}
function setMode(m){
  form.mode=m;
  if(m==="request"){ form.dayType="";form.period="";form.date="";form.time=""; renderSlots(); }
  $("#slotArea").style.display = m==="request"?"none":"";
  $("#reqArea").style.display  = m==="request"?"":"none";
  $("#go").textContent = m==="request"?"送出時段申請":"送出預約";
  check();
}
function collectRanges(){
  const out=[];
  for(let i=0;i<3;i++){
    const d=$("#req"+i+"_d"), s=$("#req"+i+"_s"), e=$("#req"+i+"_e");
    if(d&&s&&e&&d.value&&s.value&&e.value){
      const l=dLabel(d.value);
      out.push(`${d.value}${l.wd} ${s.value}–${e.value}`);
    }
  }
  return out;
}

/* 階梯式選時段：平日/假日 → 早上/下午/晚上 → 對應時間 */
let AVAIL=[];
function isWeekend(iso){const [y,m,d]=iso.split("-").map(Number);const w=new Date(y,m-1,d).getDay();return w===0||w===6;}
function dayTypeOf(iso){return isWeekend(iso)?"假日":"平日";}
function periodOf(t){const h=parseInt(t.split(":")[0],10);return h<12?"早上":h<18?"下午":"晚上";}
function renderSlots(){
  const box=$("#slotpicker"); if(!box) return;
  if(!AVAIL.length){box.innerHTML='<div class="empty">目前時段都約滿了，稍後再開放新的時段 🌙</div>';return;}
  if(!form.referrer){box.innerHTML='<div class="hint" style="margin:2px 0 0">請先於上方「推薦人」選擇，才會顯示對應的可預約時段。</div>';return;}

  // 依推薦人所屬鑑定師比對：主鑑定師＝該鑑定師全部時段；助理＝該鑑定師時段且自己也有空
  const rd=readerOf(form.referrer);
  const pool=AVAIL.filter(s=> s.reader===rd && (isReader(form.referrer) ? true : !!(s.co && s.co[form.referrer])));
  const note=isReader(form.referrer)
    ? `以下為${form.referrer}可鑑定的時段`
    : `以下為${rd}＋${form.referrer}都可以的時段`;
  if(!pool.length){box.innerHTML=`<div class="empty">目前沒有「${note.replace("以下為","")}」的名額，稍後再開放 🌙`+(form.mode==="edit"?"":"，或用下方「另行申請」")+`。</div>`;return;}

  const days=["平日","假日"];
  const hasDay=new Set(pool.map(s=>dayTypeOf(s.date)));
  let html=`<div class="poolnote">${note}</div><div class="seg">`+days.map(d=>
    `<div class="segbtn ${form.dayType===d?'on':''} ${hasDay.has(d)?'':'off'}" data-day="${d}">${d}</div>`
  ).join("")+`</div>`;

  if(form.dayType){
    const periods=["早上","下午","晚上"];
    const hasP=new Set(pool.filter(s=>dayTypeOf(s.date)===form.dayType).map(s=>periodOf(s.time)));
    html+=`<div class="seg seg3">`+periods.map(p=>
      `<div class="segbtn ${form.period===p?'on':''} ${hasP.has(p)?'':'off'}" data-period="${p}">${p}</div>`
    ).join("")+`</div>`;
  }

  if(form.dayType&&form.period){
    const match=pool.filter(s=>dayTypeOf(s.date)===form.dayType&&periodOf(s.time)===form.period);
    const byDate={}; match.forEach(s=>{(byDate[s.date]=byDate[s.date]||[]).push(s.time);});
    const ds=Object.keys(byDate).sort();
    html+= ds.length? ds.map(d=>{const l=dLabel(d);
      return `<div class="dategroup"><div class="datehd"><span class="d">${l.md}</span><span class="w">${l.wd}</span></div>
        <div class="slots">${byDate[d].sort().map(t=>
          `<div class="slot" data-date="${d}" data-time="${t}" data-on="${form.date===d&&form.time===t?1:0}">${t}</div>`).join("")}</div></div>`;
    }).join("") : '<div class="empty">這個區間目前沒有名額，換一個試試 🌙</div>';
  } else if(form.dayType){
    html+='<div class="hint" style="margin:2px 0 0">請選擇時段區間</div>';
  } else {
    html+='<div class="hint" style="margin:2px 0 0">請先選擇平日或假日</div>';
  }

  box.innerHTML=html;
  box.querySelectorAll('[data-day]').forEach(el=>{ if(el.classList.contains('off'))return;
    el.onclick=()=>{form.dayType=el.dataset.day;form.period="";form.date="";form.time="";renderSlots();check();};});
  box.querySelectorAll('[data-period]').forEach(el=>{ if(el.classList.contains('off'))return;
    el.onclick=()=>{form.period=el.dataset.period;form.date="";form.time="";renderSlots();check();};});
  box.querySelectorAll('.slot').forEach(el=>el.onclick=()=>{
    form.date=el.dataset.date;form.time=el.dataset.time;renderSlots();check();});
}
function check(){
  const emailOk=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.email||"");
  const base=form.name&&emailOk&&form.age&&form.photo&&form.referrer;
  const ok = form.mode==="request"
    ? (base && collectRanges().length>0)
    : (base && form.date && form.time);
  const b=$("#go"); if(b) b.disabled=!ok;
  const r=$("#rego"); if(r) r.disabled=!(form.date&&form.time);
}
function onPhoto(e){
  const file=e.target.files[0]; if(!file) return;
  $("#ptext").textContent="處理中…";
  const img=new Image(), rd=new FileReader();
  rd.onload=()=>{img.onload=()=>{
    const max=900, sc=Math.min(1,max/Math.max(img.width,img.height));
    const cv=document.createElement("canvas");
    cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc);
    cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
    form.photo=cv.toDataURL("image/jpeg",0.82);
    $("#pbtn").innerHTML=`<img src="${form.photo}" alt="預覽">`;
    $("#ptext").textContent="已上傳，可點照片重拍";
    $("#pbtn").querySelector==null||($("#pbtn").onclick=null);
    // 讓再次點擊可重選
    const ni=document.createElement("input");ni.type="file";ni.accept="image/*";ni.setAttribute("capture","user");ni.hidden=true;
    ni.onchange=onPhoto;$("#pbtn").appendChild(ni);$("#pbtn").onclick=()=>ni.click();
    check();
  };img.src=rd.result;};
  rd.readAsDataURL(file);
}
async function submit(){
  const b=$("#go");
  if(form.mode==="request"){
    const ranges=collectRanges();
    if(!ranges.length){alert("請至少填寫一個完整的時段（日期＋開始＋結束時間）");return;}
    b.disabled=true; b.textContent="送出中…";
    let res; try{res=await call({action:"request",name:form.name,email:form.email,age:form.age,referrer:form.referrer,photo:form.photo,ranges});}
      catch(e){res={ok:false,msg:"連線失敗，請稍後再試"};}
    if(res.ok){ successRequest(ranges); return; }
    b.disabled=false; b.textContent="送出時段申請";
    alert(res.msg||"送出失敗，請再試一次");
    return;
  }
  b.disabled=true; b.textContent="送出中…";
  let res; try{res=await call({action:"book",...form});}catch(e){res={ok:false,msg:"連線失敗，請稍後再試"};}
  if(res.ok){ success(res); return; }
  b.disabled=false; b.textContent="送出預約";
  alert(res.msg||"送出失敗，請再試一次");
  if(res.taken) customer(); // 時段被搶走 → 重新載入
}
function successRequest(ranges){
  $("#banner").innerHTML=DEMO?'<div class="demo">預覽模式</div>':'';
  $("#app").innerHTML=`<div class="wrap"><div class="done">
    <div class="mark"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></div>
    <h2>時段申請已送出</h2>

    <div class="recap">

      <div class="row"><span>推薦人</span><span style="color:${RCOLOR[form.referrer].hex};font-weight:600">${form.referrer}</span></div>
      ${ranges.map((r,i)=>`<div class="row"><span>時段 ${i+1}</span><span>${esc(r)}</span></div>`).join("")}
    </div>
    <button class="btn ghost" onclick="location.hash='';customer()">回預約頁</button>
  </div></div>`;
  form.name=form.email=form.age=form.photo="";
}

/* ═══════════ 後台：登入 → 依角色分流 ═══════════ */
let ADMIN_PW="", ME=null;

/* ═══════════ 夥伴（助理）後台 ═══════════ */
function renderHelper(name, dates, bookings){
  const mc=(RCOLOR[name]||{hex:"#8E6E9E"}).hex;
  const rd=readerOf(name);
  // 可約時段勾選格
  const grid=(dates||[]).map(g=>{

    const cells=g.slots.map(s=>{
      if(s.booked) return `<div class="aslot" style="background:#F0E8E4;color:var(--soft);border:none"><div class="t">${s.time}</div><div class="n">已被預約</div></div>`;
      const on=!!s.mine;
      return `<div class="aslot mavail" data-d="${g.date}" data-t="${s.time}" data-on="${on?1:0}" style="cursor:pointer;${on?`background:${mc};color:#fff;border:none`:''}">
        <div class="t">${s.time}</div><div class="n">${on?'我有空 ✓':'點一下設有空'}</div></div>`;
    }).join("");
    return `<div style="margin-top:18px"><div class="datehd"><span class="d serif" style="font-size:19px">${l.md}</span><span class="w">${l.wd}</span></div><div class="aslots">${cells}</div></div>`;
  }).join("") || `<div class="empty">${esc(rd)}還沒有開放時段，開了之後你就能在這裡勾選。</div>`;

  // 我帶來的預約
  const list=(bookings||[]).length? bookings.map(b=>{
    const l=dLabel(b.date), pend=(b.status||"待確認")!=="已確認";
    return `<div class="hbk" data-b='${esc(JSON.stringify(b))}' style="cursor:pointer">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div><b>${esc(b.name)}</b>　<span style="color:var(--soft);font-size:13px">${l.md}${l.wd} ${b.time}</span></div>
        <span class="tag" style="background:${pend?'var(--duo)':'var(--ok)'}">${pend?'待確認':'已確認'}</span></div></div>`;
  }).join("") : `<div class="empty">目前還沒有你帶來的預約。</div>`;

  $("#app").innerHTML=`<div class="wrap">
    <div class="hero" style="padding:34px 0 6px"><div class="kicker">${esc(name)}的後台</div><h1 class="serif">我的時間 · 我的預約</h1><p>你屬於 ${esc(rd)} 這一組</p></div>
    <button class="btn ghost" id="refresh" style="font-size:15px;padding:11px;margin:8px 0">重新整理</button>
    <div class="card" style="padding:16px">
      <div class="step"><h3 style="font-size:16px">① 設定我可以的時段</h3></div>
      <div class="hint" style="margin-left:0">下面是 ${esc(rd)} 開放的時段，點一下把你「有空」的時段點亮，會員才約得到你。</div>
      ${grid}
    </div>
    <div class="card" style="padding:16px">
      <div class="step"><h3 style="font-size:16px">② 我帶來的預約</h3></div>
      <div class="hint" style="margin-left:0">點一筆可看明細、確認或取消。</div>
      ${list}
    </div>
    <div class="link"><a href="#/">← 回預約頁</a>　·　<a href="#/admin" onclick="ADMIN_PW='';ME=null">登出</a></div>
  </div>`;

  $("#refresh").onclick=admin;
  document.querySelectorAll(".mavail").forEach(el=>el.onclick=async()=>{
    const on=el.dataset.on==="1", nv=!on;
    el.dataset.on=nv?1:0;
    el.style.cssText=nv?`cursor:pointer;background:${mc};color:#fff;border:none`:"cursor:pointer";
    el.querySelector(".n").textContent=nv?"我有空 ✓":"點一下設有空";
    let res;try{res=await call({action:"setMyAvail",pw:ADMIN_PW,date:el.dataset.d,time:el.dataset.t,val:nv});}catch(e){res={ok:false};}
    if(!res.ok){ el.dataset.on=on?1:0; alert(res.msg||"設定失敗"); admin(); }
  });
  document.querySelectorAll(".hbk").forEach(el=>el.onclick=()=>openBooking(JSON.parse(el.dataset.b)));
}

function openSlotMenu(s){
  const l=dLabel(s.date);
  const co=Object.assign({}, s.co||{});
  const m=document.createElement("div");m.className="mask";
  m.innerHTML=`<div class="modal">
    <div style="text-align:center;margin-bottom:6px"><div style="font-family:'Noto Serif TC',serif;font-size:20px;font-weight:600">${l.md}${l.wd} ${s.time}</div>
      <div style="color:var(--soft);font-size:13px">可搭配對象（${esc(ME?ME.name:"主鑑定師")}一定可以）</div></div>
    <div class="chips" style="justify-content:center;margin:14px 0 4px">
      ${((ME&&ME.helpers)||[]).map(h=>`<span class="chip cm" data-h="${esc(h)}" data-on="${co[h]?1:0}" style="border-color:${RCOLOR[h].hex}">${esc(h)}會員可約</span>`).join("")}
    </div>
    <div style="height:16px"></div>
    <button class="btn" id="s_save">儲存設定</button>
    <div style="height:8px"></div>
    <button class="btn ghost" id="s_close">關閉</button>
    <div style="height:8px"></div>
    <button class="btn" style="background:var(--duo)" id="s_del">刪除此時段</button>
  </div>`;
  m.onclick=e=>{if(e.target===m)m.remove();};
  document.body.appendChild(m);
  m.querySelectorAll(".cm").forEach(c=>c.onclick=()=>{const h=c.dataset.h;co[h]=!co[h];c.dataset.on=co[h]?1:0;});
  m.querySelector("#s_close").onclick=()=>m.remove();
  m.querySelector("#s_save").onclick=async()=>{
    const btn=m.querySelector("#s_save");btn.disabled=true;btn.textContent="儲存中…";
    let res;try{res=await call({action:"setAvail",pw:ADMIN_PW,date:s.date,time:s.time,co});}catch(e){res={ok:false};}
    m.remove(); if(res.ok)admin(); else alert(res.msg||"儲存失敗");
  };
  m.querySelector("#s_del").onclick=async()=>{
    if(!confirm(`刪除 ${l.md}${l.wd} ${s.time} 這個時段嗎？`))return;
    const btn=m.querySelector("#s_del");btn.disabled=true;btn.textContent="刪除中…";
    let res;try{res=await call({action:"delSlot",pw:ADMIN_PW,date:s.date,time:s.time});}catch(e){res={ok:false};}
    m.remove(); if(res.ok)admin(); else alert(res.msg||"刪除失敗");
  };
}
async function delOpenSlot(s){
  const l=dLabel(s.date);
  if(!confirm(`刪除 ${l.md}${l.wd} ${s.time} 這個「可預約」時段嗎？`))return;
  let res;try{res=await call({action:"delSlot",pw:ADMIN_PW,date:s.date,time:s.time});}catch(e){res={ok:false};}
  if(res.ok)admin(); else alert(res.msg||"刪除失敗");
}

let addTimes=new Set();
function toggleAdd(){
  const p=$("#addPanel");
  if(p.innerHTML){p.innerHTML="";return;}
  addTimes=new Set();
  const common=["10:30","11:00","14:00","14:30","15:00","15:30","16:00","16:30","20:00","20:30","21:00","21:30"];
  p.innerHTML=`<div class="panel">
    <label>日期</label><input id="ad_date" type="date">
    <label>時段（可多選，或用下方快速帶入）</label>
    <div>
      <span class="quick" data-q="午">午場 14:00–15:30</span>
      <span class="quick" data-q="晚">晚場 20:00–21:30</span>
      <span class="quick" data-q="早">上午 10:30–11:00</span>
    </div>
    <div class="chips" id="ad_chips">${common.map(t=>`<span class="chip" data-t="${t}" data-on="0">${t}</span>`).join("")}</div>
    ${((ME&&ME.helpers)||[]).length?`<label style="margin-top:14px">這批時段誰的會員也能約？（${esc(ME.name)}一定可以）</label>
    <div class="chips" id="ad_co">${((ME&&ME.helpers)||[]).map(h=>`<span class="chip cm" data-h="${esc(h)}" data-on="1" style="border-color:${RCOLOR[h].hex}">${esc(h)}會員可約</span>`).join("")}</div>`:''}
    <div style="height:14px"></div>
    <button class="btn" id="ad_go">加入時段</button>
  </div>`;
  document.querySelectorAll("#ad_chips .chip").forEach(c=>c.onclick=()=>{
    const t=c.dataset.t; if(addTimes.has(t)){addTimes.delete(t);c.dataset.on="0";}
    else{addTimes.add(t);c.dataset.on="1";}});
  document.querySelectorAll("#ad_co .cm").forEach(c=>c.onclick=()=>c.dataset.on=c.dataset.on==="1"?"0":"1");
  document.querySelectorAll(".quick").forEach(q=>q.onclick=()=>{
    const map={"午":["14:00","14:30","15:00","15:30"],"晚":["20:00","20:30","21:00","21:30"],"早":["10:30","11:00"]};
    map[q.dataset.q].forEach(t=>{addTimes.add(t);
      const c=document.querySelector(`#ad_chips .chip[data-t="${t}"]`); if(c)c.dataset.on="1";});});
  $("#ad_go").onclick=doAdd;
}
async function doAdd(){
  const date=$("#ad_date").value;
  if(!date){alert("請先選日期");return;}
  if(!addTimes.size){alert("請至少選一個時段");return;}
  const b=$("#ad_go");b.disabled=true;b.textContent="加入中…";
  const co={}; document.querySelectorAll("#ad_co .cm").forEach(c=>co[c.dataset.h]=c.dataset.on==="1");
  let res;try{res=await call({action:"addSlots",pw:ADMIN_PW,date,times:[...addTimes],co});}catch(e){res={ok:false};}
  if(res.ok){admin();} else {b.disabled=false;b.textContent="加入時段";alert(res.msg||"加入失敗");}
}
function photoUrl(id){return id?`https://drive.google.com/thumbnail?id=${id}&sz=w600`:"";}
function openBooking(b){
  const rc=RCOLOR[b.referrer]||{hex:"#888"};
  const l=dLabel(b.date);
  const pend=(b.status||"待確認")!=="已確認";
  const img=b.photoId?`<img class="ph" src="${photoUrl(b.photoId)}" alt="自拍照">`
    :`<div class="ph" style="display:flex;align-items:center;justify-content:center;color:var(--soft)">（無照片）</div>`;
  const m=document.createElement("div");m.className="mask";
  m.innerHTML=`<div class="modal">
    ${img}
    <div class="mrow"><span>狀態</span><span style="font-weight:600;color:${pend?'var(--duo)':'var(--ok)'}">${pend?'待確認':'已確認'}</span></div>
    <div class="mrow"><span>姓名</span><span style="font-weight:600">${esc(b.name)}</span></div>
    <div class="mrow"><span>虛歲</span><span>${esc(b.age)}</span></div>
    <div class="mrow"><span>推薦人</span><span class="tag" style="background:${rc.hex}">${esc(b.referrer)}</span></div>
    <div class="mrow"><span>時段</span><span>${l.md}${l.wd} ${b.time}</span></div>
    ${b.email?`<div class="mrow"><span>Email</span><span style="font-size:13px;color:var(--soft)">${esc(b.email)}</span></div>`:""}
    <div class="mrow"><span>預約編號</span><span class="code">${esc(b.code)}</span></div>
    ${b.submitted?`<div class="mrow"><span>送出時間</span><span style="color:var(--soft);font-size:13px">${esc(b.submitted)}</span></div>`:""}
    <div style="height:18px"></div>
    ${pend?`<button class="btn" id="mconfirm">確認預約，寄成功通知給會員</button><div style="height:8px"></div>`:""}
    <button class="btn ghost" id="mclose">關閉</button>
    <div style="height:8px"></div>
    <button class="btn" style="background:var(--duo)" id="mcancel">取消這筆預約</button>
  </div>`;
  m.onclick=e=>{if(e.target===m)m.remove();};
  document.body.appendChild(m);
  m.querySelector("#mclose").onclick=()=>m.remove();
  if(pend) m.querySelector("#mconfirm").onclick=async()=>{
    const btn=m.querySelector("#mconfirm");btn.disabled=true;btn.textContent="確認中…";
    let res;try{res=await call({action:"confirm",pw:ADMIN_PW,code:b.code});}catch(e){res={ok:false};}
    m.remove(); if(res.ok)admin(); else alert(res.msg||"確認失敗");
  };
  m.querySelector("#mcancel").onclick=async()=>{
    if(!confirm(`確定要取消 ${b.name} 的預約嗎？此時段會重新開放。`))return;
    const btn=m.querySelector("#mcancel");btn.disabled=true;btn.textContent="取消中…";
    let res;try{res=await call({action:"cancel",pw:ADMIN_PW,code:b.code});}catch(e){res={ok:false};}
    m.remove(); if(res.ok)admin(); else alert(res.msg||"取消失敗");
  };
}
</script>
